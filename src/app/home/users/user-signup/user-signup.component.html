<main class="signup-page">
  <section class="signup-card" aria-labelledby="signup-title">
    <h1 id="signup-title">Become A Member</h1>

    <form [formGroup]="userSignForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="name-row">
        <div class="field">
          <label for="firstName">First Name <span
              aria-hidden="true">*</span></label>
          <input id="firstName" type="text" formControlName="firstName"
            autocomplete="given-name">
          <span class="text-danger"
            *ngIf='firstName?.touched && firstName?.errors?.["required"]'> First
            Name is required</span>
        </div>

        <div class="field">
          <label for="lastName">Last Name <span aria-hidden="true">*</span></label>
          <input id="lastName" type="text" formControlName="lastName"
            autocomplete="family-name">
          <span class="text-danger"
            *ngIf="userSignForm.get('lastName')?.touched && userSignForm.get('lastName')?.errors?.['required']">
            Last Name is required</span>
        </div>
      </div>

      <div class="field">
        <label for="address">Address <span aria-hidden="true">*</span></label>
        <input id="address" type="text" formControlName="address"
          autocomplete="street-address">
        <span class="text-danger"
          *ngIf="userSignForm.get('address')?.touched && userSignForm.get('address')?.errors?.['required']">
          Address is required</span>
      </div>

      <div class="field">
        <label for="city">City <span aria-hidden="true">*</span></label>
        <input id="city" type="text" formControlName="city"
          autocomplete="address-level2">
        <span class="text-danger"
          *ngIf="userSignForm.get('city')?.touched && userSignForm.get('city')?.errors?.['required']">
          City is required</span>
      </div>

      <div class="field">
        <label for="state">State <span aria-hidden="true">*</span></label>
        <input id="state" type="text" formControlName="state"
          autocomplete="address-level1">
        <span class="text-danger"
          *ngIf="userSignForm.get('state')?.touched && userSignForm.get('state')?.errors?.['required']">
          State is required</span>
      </div>

      <div class="field">
        <label for="pin">Pin / Zip code <span aria-hidden="true">*</span></label>
        <input id="pin" type="text" formControlName="pin"
          autocomplete="postal-code">
        <span class="text-danger"
          *ngIf="userSignForm.get('pin')?.touched && userSignForm.get('pin')?.errors?.['required']">
          Pin / Zip code is required</span>
      </div>

      <div class="field">
        <label for="email">Email <span aria-hidden="true">*</span></label>
        <input id="email" type="email" formControlName="email"
          autocomplete="email">
        <span class="text-danger"
          *ngIf='email?.touched && email?.errors?.["required"]'> Email is
          required</span>
        <span class="text-danger"
          *ngIf='email?.touched && email?.errors?.["email"]'> Enter a valid
          email address</span>
      </div>

      <div class="field">
        <label for="password">Password <span aria-hidden="true">*</span></label>
        <input id="password" type="password" formControlName="password"
          autocomplete="new-password">
        <span class="text-danger"
          *ngIf='password?.touched && password?.errors?.["required"]'> Password
          is required</span>

      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password*</label>
        <input id="confirmPassword" type="password"
          formControlName="confirmPassword" autocomplete="new-password">
        <span class="text-danger"
          *ngIf='confirmPassword?.touched && confirmPassword?.errors?.["required"]'>
          Confirm Password is required</span>
      </div>

      <span class="text-danger"
        *ngIf="confirmPassword?.touched && userSignForm.errors?.['passwordMismatch']">
        Passwords don't match
      </span>

      <div class="text-center form-group-margin">
        <button type="submit" class="btn btn-warning"
          [disabled]="userSignForm.invalid">Create Account</button>
      </div>

      <div *ngIf="alertMessage" class="alert"
        [ngClass]="alertType === 0 ? 'alert-success' : alertType === 1 ? 'alert-warning' : 'alert-danger'"
        role="alert">{{ alertMessage }}</div>

    </form>
  </section>
</main>
