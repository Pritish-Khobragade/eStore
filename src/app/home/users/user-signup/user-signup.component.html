<main class="signup-page">
  <section class="signup-card" aria-labelledby="signup-title">
    <h1 id="signup-title">Become A Member</h1>

    <form [formGroup]="userSignForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="name-row">
        <div class="field">
          <label for="firstName">First Name <span aria-hidden="true">*</span></label>
          <input id="firstName" type="text" formControlName="firstName" autocomplete="given-name">
        </div>

        <div class="field">
          <label for="lastName">Last Name</label>
          <input id="lastName" type="text" formControlName="lastName" autocomplete="family-name">
        </div>
      </div>

      <div class="field">
        <label for="address">Address</label>
        <input id="address" type="text" formControlName="address" autocomplete="street-address">
      </div>

      <div class="field">
        <label for="city">City</label>
        <input id="city" type="text" formControlName="city" autocomplete="address-level2">
      </div>

      <div class="field">
        <label for="state">State</label>
        <input id="state" type="text" formControlName="state" autocomplete="address-level1">
      </div>

      <div class="field">
        <label for="pin">Pin / Zip code</label>
        <input id="pin" type="text" formControlName="pin" autocomplete="postal-code">
      </div>

      <div class="field">
        <label for="email">Email <span aria-hidden="true">*</span></label>
        <input id="email" type="email" formControlName="email" autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Password <span aria-hidden="true">*</span></label>
        <input id="password" type="password" formControlName="password" autocomplete="new-password">
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <input id="confirmPassword" type="password" formControlName="confirmPassword" autocomplete="new-password">
      </div>

      <button type="submit" class="signup-button">Create Account</button>
    </form>
  </section>
</main>
