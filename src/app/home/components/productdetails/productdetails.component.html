@if (product$ | async; as product) {
    <div class="row my-5 product-details-container">
        <div class="col-5 product-image-container">
            <img [src]="product.product_img" [alt]="product.product_name">
        </div>
        <div class="col-7 product-information-container">
            <span id="product-name">{{ product.product_name }}</span>
            <app-ratings [score]="product.ratings"></app-ratings>
            <hr>
            <div class="product-price">
                Price: <span class="price">{{ product.price | currency }}</span>
                <div>Inclusive of all taxes.</div>
            </div>
            <div class="product-description">
                <p>{{ product.product_description }}</p>
            </div>
        </div>
    </div>
} @else {
    <p class="my-5">Product not found.</p>
}
