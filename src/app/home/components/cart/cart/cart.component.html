<section class="cart-page">
  <ng-container *ngIf="cart$ | async as cart">
    <div *ngIf="cart.products.length === 0; else cartContents" class="empty-cart">
      <h1>The Cart Is Empty</h1>
      <hr />
      <a class="continue-shopping" [routerLink]="['/home/products']">Continue Shopping</a>
    </div>

    <ng-template #cartContents>
      <div class="cart-layout">
        <div class="cart-items">
          <article *ngFor="let item of cart.products" class="cart-item">
            <img
              class="cart-item-image"
              [src]="item.product.product_img"
              [alt]="item.product.product_name"
            />

            <div class="cart-item-details">
              <h3 class="cart-item-name">{{ item.product.product_name }}</h3>
              <app-ratings [score]="item.product.ratings"></app-ratings>

              <div class="cart-item-actions">
                <div class="quantity-control" [attr.aria-label]="'Quantity: ' + item.quantity">
                  <button type="button" aria-label="Decrease quantity" (click)="updateQuantity('-', item)">-</button>
                  <span>{{ item.quantity }}</span>
                  <button type="button" aria-label="Increase quantity" (click)="updateQuantity('+', item)">+</button>
                </div>
                <button type="button" class="remove-button" (click)="removeItem(item)">Remove Item</button>
              </div>
            </div>

            <p class="cart-item-price">{{ item.amount | currency }}</p>
          </article>
        </div>

        <form class="cart-sidebar" [formGroup]="deliveryForm" (ngSubmit)="onSubmit()" novalidate>
          <section class="delivery-address" aria-labelledby="delivery-address-title">
            <h3 id="delivery-address-title">Delivery Address</h3>

            <div class="address-field">
              <label for="deliveryName">Name</label>
              <input id="deliveryName" type="text" formControlName="name" autocomplete="name" />
            </div>
            <div class="address-field">
              <label for="deliveryAddress">Address</label>
              <input id="deliveryAddress" type="text" formControlName="address" autocomplete="street-address" />
            </div>
            <div class="address-field">
              <label for="deliveryCity">City</label>
              <input id="deliveryCity" type="text" formControlName="city" autocomplete="address-level2" />
            </div>
            <div class="address-field">
              <label for="deliveryState">State</label>
              <input id="deliveryState" type="text" formControlName="state" autocomplete="address-level1" />
            </div>
            <div class="address-field">
              <label for="deliveryPin">Pin</label>
              <input id="deliveryPin" type="text" formControlName="pin" autocomplete="postal-code" />
            </div>
          </section>

          <aside class="cart-summary" aria-label="Order summary">
            <h3>Summary</h3>
            <div class="summary-row">
              <span>Cart Total</span>
              <span>{{ cart.totalAmount | currency }}</span>
            </div>
            <div class="summary-row">
              <span>Shipping Charges</span>
              <span>Free</span>
            </div>
            <hr />
            <div class="summary-row summary-total">
              <span>Total</span>
              <span>{{ cart.totalAmount | currency }}</span>
            </div>
            <button type="submit" class="checkout-button" [disabled]="deliveryForm.invalid">Checkout</button>
          </aside>
        </form>
      </div>
    </ng-template>
  </ng-container>
</section>
