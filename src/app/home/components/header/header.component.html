<header class="header bg-dark">
    <div class="brand">
        <h1>eStore</h1>
    </div>
    <form *ngIf="displaySearch" class="search-form" role="search" (submit)="onClickSearch($event, keyword.value, categoryOptions.value)">
        <select #categoryOptions class="dropdown p-0 m-0" aria-label="Search category">
            <option value="">All categories</option>
            <option *ngFor="let category of categoryStore.topLevelCategories$ | async" [value]="category.id">{{ category.category }}</option>
        </select>
        <input #keyword class="form-control search-box" type="search" placeholder="Search..." aria-label="Search" />
        <button class="search-button" type="submit"><fa-icon [icon]="faMagnifyingGlass"></fa-icon></button>
    </form>
    <div class="login-container p-0">
        <fa-icon class="user-icon" [icon]="faUserCircle"></fa-icon>
        <h5><a href="#">Sign in</a></h5> / <h5><a href="#">Register</a></h5>
    </div>
    <div class="cart-wishlist p-0 list-item">
        <button type="button" class="btn btn-dark position-relative">
            <fa-icon [icon]="faCartShopping"></fa-icon>
            <ng-container *ngIf="cartStore.cart$ | async as cart">
                <span *ngIf="cart.totalProducts > 0"
                    class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-warning text-dark">
                    {{ cart.totalProducts }}
                </span>
            </ng-container>
        </button>
    </div>

</header>
