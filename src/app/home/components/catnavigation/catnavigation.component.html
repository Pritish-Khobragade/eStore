<div class="navigation-container">
  <ul>
    <li>
      <a (click)="selectProductFor(null)" routerLink="/home/products">Home</a>
    </li>
    <ng-container *ngIf="displayOptions">
    <li *ngFor="let category of CategoryStore.topLevelCategories$ | async">
      <a href="javascript:void(0)" (click)="selectProductFor(category.category)">
        {{ category.category }}
      </a>
    </li>
    </ng-container>
  </ul>
</div>
