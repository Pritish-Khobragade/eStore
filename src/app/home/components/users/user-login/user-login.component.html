<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <h1 id="login-title">Sign In</h1>

    <form [formGroup]="userloginForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="field">
        <label for="email">Email <span aria-hidden="true">*</span></label>
        <input id="email" type="email" formControlName="email" autocomplete="email">
        <span class="error"
          *ngIf="email?.touched && email?.errors?.['required']">
          Email is required
        </span>
        <span class="error"
          *ngIf="email?.touched && email?.errors?.['email']">
          Enter a valid email address
        </span>
      </div>

      <div class="field">
        <label for="password">Password <span aria-hidden="true">*</span></label>
        <input id="password" type="password" formControlName="password"
          autocomplete="current-password">
        <span class="error"
          *ngIf="password?.touched && password?.errors?.['required']">
          Password is required
        </span>
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-warning"
          [disabled]="userloginForm.invalid">Sign In</button>
      </div>

      <p class="register-link">
        Not a member? <a routerLink="../signup">Register</a>
      </p>

      <div class="alert" [ngClass]="alertType === 0 ? 'alert-success' : 'alert-danger'"
        *ngIf="alertMessage !== ''">

        {{ alertMessage }}
      </div>

    </form>
  </section>
</main>
