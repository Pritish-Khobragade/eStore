<div class="main-product-container">
    <a *ngFor="let product of productStoreItem.products | async" [routerLink]="['/home/products', product.id]"
        class="mx-5 p-3 product-card">
        <div class="product-image-container">
            <img [src]="product.product_img"
                [alt]="product.product_name" class="img-fluid">
        </div>
        <div class="product-info">
            <h5>{{ product.product_name }}</h5>
            <p class="product-price">{{ product.price | currency }}</p>
            <app-ratings [score]="product.ratings"></app-ratings>
        </div>
    </a>
</div>
