<app-header (searchClicked)="onSearchKeyword($event)"></app-header>
<app-catnavigation (productForSelected)="onSelectProductFor($event)"></app-catnavigation>

<div class="container-fluid">
    @let hideCategorySidebar = hideCategorySidebar$ | async;
    <div class="row">
        @if (!hideCategorySidebar) {
            <div class="col-lg-2 col-md-3 col-sm-4">
                <app-sidenavigation (subCategoryClicked)="onSelectSubCategory($event)"></app-sidenavigation>
            </div>
        }
        <div [class.col-lg-10]="!hideCategorySidebar"
            [class.col-md-9]="!hideCategorySidebar"
            [class.col-sm-8]="!hideCategorySidebar"
            [class.col-12]="hideCategorySidebar">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
